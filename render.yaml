services:
  - type: web
    name: genevista
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GENEVISTA_DB
        value: /app/data/demo/genevista.sqlite
      - key: GENEVISTA_AUTH_ENABLED
        value: "true"
      - key: GENEVISTA_COOKIE_SECURE
        value: "true"
      - key: GENEVISTA_USERNAME
        sync: false
      - key: GENEVISTA_PASSWORD_HASH
        sync: false
