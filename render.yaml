services:
  - type: web
    name: genevista
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: genevista-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: GENEVISTA_DB
        value: /var/data/genevista.sqlite
      - key: GENEVISTA_AUTH_ENABLED
        value: "true"
      - key: GENEVISTA_COOKIE_SECURE
        value: "true"
      - key: GENEVISTA_USERNAME
        sync: false
      - key: GENEVISTA_PASSWORD_HASH
        sync: false
      - key: GENEVISTA_DB_URL
        sync: false
      - key: GENEVISTA_DB_SHA256
        sync: false
