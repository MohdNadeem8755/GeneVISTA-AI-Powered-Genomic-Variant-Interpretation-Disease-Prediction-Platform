name: GeneVISTA verification and optional Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Build frontend
      working-directory: frontend
      run: |
        corepack enable
        corepack prepare pnpm@10.11.0 --activate
        pnpm install --frozen-lockfile
        pnpm build
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install backend test dependencies
      run: python -m pip install -r backend/requirements.txt httpx2
    - name: Run backend and data tests
      env:
        GENEVISTA_DB: data/demo/genevista.sqlite
      run: python -m unittest discover -s tests -v

  datadog:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
    - uses: actions/checkout@v4
    - name: Run Datadog Synthetic tests
      if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
      uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb
      with:
        api_key: ${{ secrets.DD_API_KEY }}
        app_key: ${{ secrets.DD_APP_KEY }}
        test_search_query: 'tag:e2e-tests'
